name: AirDesk-Mac
options:
  bundleIdPrefix: com.helloxtech
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"
  postGenCommand: ../scripts/patch_local_package_refs.sh AirDesk-Mac.xcodeproj/project.pbxproj AirDeskProtocol ../Shared/AirDeskProtocol

packages:
  AirDeskProtocol:
    path: ../Shared/AirDeskProtocol
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2

targets:
  AirDesk:
    type: application
    platform: macOS
    sources:
      - path: Sources/AirDesk
      - path: Assets.xcassets
      - path: Helpers
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://hellox.ca/products/airdesk/releases/appcast.xml
        SUPublicEDKey: sIpthXZYO7PTsnAyPa4bzuskb6IkaJKOs9fMFm9EeQ4=
    entitlements:
      path: AirDesk.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helloxtech.airdesk.mac
        MARKETING_VERSION: 1.2.11
        CURRENT_PROJECT_VERSION: 29
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: AirDesk.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: AirDeskProtocol
        product: AirDeskProtocol
      - package: Sparkle
        product: Sparkle
      - sdk: ScreenCaptureKit.framework
      - sdk: VideoToolbox.framework
