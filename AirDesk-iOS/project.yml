name: AirDesk
options:
  bundleIdPrefix: com.helloxtech
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

targets:
  AirDesk:
    type: application
    platform: iOS
    sources:
      - path: AirDesk
      - path: AirDesk/Assets.xcassets
    info:
      path: AirDesk/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helloxtech.airdesk.ios
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: AirDesk/Info.plist
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
