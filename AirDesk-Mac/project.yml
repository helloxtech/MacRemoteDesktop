name: AirDesk-Mac
options:
  bundleIdPrefix: com.helloxtech
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"

targets:
  AirDesk:
    type: application
    platform: macOS
    sources:
      - path: Sources/AirDesk
    info:
      path: Info.plist
    entitlements:
      path: AirDesk.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helloxtech.airdesk.mac
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: AirDesk.entitlements
        DEVELOPMENT_TEAM: ""
    dependencies:
      - framework: ScreenCaptureKit.framework
        weak: false
      - framework: VideoToolbox.framework
        weak: false
